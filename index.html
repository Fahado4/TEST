<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fahad's First Website</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
      line-height: 1.6;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    /* Dark mode styles */
    .dark {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%) !important;
      color: #ffffff !important;
    }

    .dark .main-content {
      background: rgba(255, 255, 255, 0.05) !important;
    }

    .dark .card {
      background: rgba(255, 255, 255, 0.1) !important;
      backdrop-filter: blur(10px) !important;
    }

    .dark .music-player {
      background: rgba(0, 0, 0, 0.95) !important;
    }

    /* Main content container */
    .main-content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      padding-bottom: 140px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      min-height: 100vh;
    }

    /* Header section */
    .header {
      text-align: center;
      margin-bottom: 40px;
      padding: 40px 20px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      backdrop-filter: blur(10px);
    }

    .header h1 {
      font-size: 3rem;
      font-weight: 700;
      margin-bottom: 15px;
      background: linear-gradient(45deg, #fff, #f0f0f0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header p {
      font-size: 1.2rem;
      opacity: 0.9;
      max-width: 600px;
      margin: 0 auto;
    }

    /* Cards */
    .card {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 30px;
      margin-bottom: 30px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
    }

    .card h2 {
      font-size: 1.8rem;
      margin-bottom: 20px;
      color: #fff;
      text-align: center;
    }

    /* Profile image */
    .profile-image {
      width: 100%;
      max-width: 400px;
      border-radius: 20px;
      margin: 20px auto;
      display: block;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      transition: transform 0.3s ease;
    }

    .profile-image:hover {
      transform: scale(1.02);
    }

    /* Fun facts list */
    .fun-facts {
      list-style: none;
      padding: 0;
    }

    .fun-facts li {
      background: rgba(255, 255, 255, 0.1);
      margin: 10px 0;
      padding: 15px 20px;
      border-radius: 10px;
      border-left: 4px solid #667eea;
      transition: all 0.3s ease;
    }

    .fun-facts li:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateX(10px);
    }

    /* Clock section */
    .clock {
      font-size: 2.5rem;
      font-weight: bold;
      text-align: center;
      color: #fff;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
    }

    /* Interactive button */
    .interactive-btn {
      background: linear-gradient(45deg, #667eea, #764ba2);
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 1.1rem;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      display: block;
      margin: 20px auto;
    }

    .interactive-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
    }

    /* Message display */
    .message {
      text-align: center;
      font-size: 1.2rem;
      margin: 20px 0;
      padding: 15px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Control buttons */
    .control-buttons {
      position: fixed;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 10px;
      z-index: 1001;
    }

    .control-btn {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50px;
      padding: 12px 20px;
      cursor: pointer;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
      font-size: 14px;
    }

    .control-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: scale(1.05);
    }

    /* Music Player */
    .music-player {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0, 0, 0, 0.95);
      backdrop-filter: blur(20px);
      padding: 20px;
      z-index: 1000;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .player-content {
      max-width: 800px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 20px;
    }

    .now-playing {
      text-align: left;
    }

    .song-title {
      font-weight: bold;
      font-size: 1.1rem;
      margin-bottom: 5px;
      color: #fff;
    }

    .song-artist {
      font-size: 0.9rem;
      opacity: 0.8;
      color: #ccc;
    }

    .player-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
    }

    .control-btn-player {
      background: none;
      border: none;
      color: white;
      font-size: 20px;
      cursor: pointer;
      padding: 10px;
      border-radius: 50%;
      transition: all 0.3s;
    }

    .control-btn-player:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: scale(1.1);
    }

    .play-btn {
      background: #1db954 !important;
      font-size: 24px;
      width: 50px;
      height: 50px;
    }

    .play-btn:hover {
      background: #1ed760 !important;
    }

    .progress-container {
      text-align: right;
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
      cursor: pointer;
      position: relative;
      margin-bottom: 8px;
    }

    .progress-fill {
      height: 100%;
      background: #1db954;
      border-radius: 3px;
      width: 0%;
      transition: width 0.1s;
    }

    .time-display {
      font-size: 12px;
      opacity: 0.8;
      color: #ccc;
    }

    /* Playlist Sidebar */
    .playlist-sidebar {
      position: fixed;
      top: 0;
      left: -350px;
      width: 350px;
      height: 100vh;
      background: rgba(0, 0, 0, 0.95);
      backdrop-filter: blur(20px);
      transition: left 0.3s ease;
      z-index: 999;
      overflow-y: auto;
      padding: 20px;
    }

    .playlist-sidebar.open {
      left: 0;
    }

    .playlist-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .playlist-title {
      font-size: 24px;
      font-weight: bold;
      color: #fff;
    }

    .close-playlist {
      background: none;
      border: none;
      color: white;
      font-size: 24px;
      cursor: pointer;
      padding: 8px;
      border-radius: 50%;
      transition: background 0.3s;
    }

    .close-playlist:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .playlist-item {
      display: flex;
      align-items: center;
      padding: 15px;
      margin: 8px 0;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s;
      background: rgba(255, 255, 255, 0.05);
    }

    .playlist-item:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateX(5px);
    }

    .playlist-item.active {
      background: #1db954;
      box-shadow: 0 5px 15px rgba(29, 185, 84, 0.3);
    }

    .song-number {
      width: 40px;
      text-align: center;
      font-weight: bold;
      color: #fff;
      font-size: 1.1rem;
    }

    .song-info {
      flex: 1;
      margin-left: 15px;
    }

    .song-name {
      font-weight: bold;
      margin-bottom: 5px;
      color: #fff;
    }

    .song-duration {
      font-size: 13px;
      opacity: 0.7;
      color: #ccc;
    }

    .toggle-playlist {
      position: fixed;
      top: 20px;
      left: 20px;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50px;
      padding: 12px 20px;
      cursor: pointer;
      z-index: 1001;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
      font-size: 14px;
    }

    .toggle-playlist:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: scale(1.05);
    }

    /* Responsive design */
    @media (max-width: 768px) {
      .header h1 {
        font-size: 2rem;
      }
      
      .player-content {
        grid-template-columns: 1fr;
        gap: 15px;
        text-align: center;
      }
      
      .now-playing {
        text-align: center;
      }
      
      .progress-container {
        text-align: center;
      }
      
      .playlist-sidebar {
        width: 100%;
        left: -100%;
      }
    }
  </style>
</head>
<body>
  <!-- Playlist Toggle Button -->
  <button class="toggle-playlist" id="playlistToggleBtn" onclick="togglePlaylist()">🎵 Playlist</button>

  <!-- Control Buttons -->
  <div class="control-buttons">
    <button class="control-btn" id="darkModeBtn" onclick="toggleDarkMode()">🌙 Dark Mode</button>
  </div>

  <!-- Playlist Sidebar -->
  <div class="playlist-sidebar" id="playlistSidebar">
    <div class="playlist-header">
      <div class="playlist-title">Your Playlist</div>
      <button class="close-playlist" onclick="togglePlaylist()">✕</button>
    </div>
    <div id="playlistContainer">
      <!-- Playlist items will be generated here -->
    </div>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <!-- Header -->
    <div class="header">
      <h1>Hi, I'm Fahad 👋</h1>
      <p>This is my first website. I'm an Electrical Engineering student who is بياع</p>
    </div>

    <!-- Profile Image -->
    <div class="card">
      <img src="sand-castle.webp" alt="Saudi Arabia" class="profile-image">
    </div>

    <!-- Fun Facts -->
    <div class="card">
      <h2>🌟 Fun Facts About Me</h2>
      <ul class="fun-facts">
        <li>I love electronics</li>
        <li>I'm learning to code</li>
        <li>I enjoy coffee ☕</li>
      </ul>
    </div>

    <!-- Live Clock -->
    <div class="card">
      <h2>⏰ Current Time</h2>
      <div class="clock" id="clock"></div>
    </div>

    <!-- Interactive Section -->
    <div class="card">
      <button class="interactive-btn" onclick="sayHello()">!أضغطني</button>
      <div class="message" id="message"></div>
    </div>
  </div>

  <!-- Music Player -->
  <div class="music-player">
    <div class="player-content">
      <div class="now-playing">
        <div class="song-title" id="currentSongTitle">No song playing</div>
        <div class="song-artist" id="currentSongArtist">Select a song from playlist</div>
      </div>
      
      <div class="player-controls" style="justify-content: center; gap: 32px;">
        <button class="control-btn-player svg-btn" onclick="previousTrack()" aria-label="Previous">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5"></line></svg>
        </button>
        <button class="control-btn-player play-btn svg-btn" id="playBtn" onclick="togglePlay()" aria-label="Play/Pause">
          <span id="playPauseIcon">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
          </span>
        </button>
        <button class="control-btn-player svg-btn" onclick="nextTrack()" aria-label="Next">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19"></line></svg>
        </button>
      </div>
      
      <div class="progress-container">
        <div class="progress-bar" onclick="seek(event)">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="time-display">
          <span id="currentTime">0:00</span> / <span id="totalTime">0:00</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Audio Element -->
  <audio id="audioPlayer" preload="metadata"></audio>

  <style>
    .svg-btn {
      width: 56px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      box-shadow: 0 2px 8px rgba(0,0,0,0.10);
      border: none;
      transition: background 0.2s, box-shadow 0.2s, transform 0.2s;
    }
    .svg-btn svg {
      display: block;
      color: #fff;
    }
    .svg-btn:active, .svg-btn:focus {
      outline: none;
      background: #1db954;
      color: #fff;
      box-shadow: 0 4px 16px rgba(29,185,84,0.15);
      transform: scale(0.97);
    }
    .play-btn {
      background: #1db954 !important;
      color: #fff !important;
      width: 64px;
      height: 64px;
      box-shadow: 0 4px 16px rgba(29,185,84,0.15);
    }
    .play-btn svg {
      color: #fff;
    }
  </style>

  <script>
    // Playlist data
    const playlist = [
      {
        title: "شاب الشعر ياعبيد",
        artist: "أشباح الخبيتي",
        src: "Remixat-1.opus",
        duration: "3:45"
      },
      {
        title: "Azizam",
        artist: "Ed Sheeran", 
        src: "youtube_I66_rC6o4K4_audio.opus",
        duration: "4:20"
      }
    ];

    let currentTrackIndex = 0;
    let isPlaying = false;
    const audioPlayer = document.getElementById('audioPlayer');
    const playBtn = document.getElementById('playBtn');
    const currentSongTitle = document.getElementById('currentSongTitle');
    const currentSongArtist = document.getElementById('currentSongArtist');
    const progressFill = document.getElementById('progressFill');
    const currentTimeDisplay = document.getElementById('currentTime');
    const totalTimeDisplay = document.getElementById('totalTime');

    // Initialize playlist
    function initializePlaylist() {
      const container = document.getElementById('playlistContainer');
      playlist.forEach((track, index) => {
        const item = document.createElement('div');
        item.className = 'playlist-item';
        item.onclick = () => playTrack(index);
        item.innerHTML = `
          <div class="song-number">${index + 1}</div>
          <div class="song-info">
            <div class="song-name">${track.title}</div>
            <div class="song-duration">${track.duration}</div>
          </div>
        `;
        container.appendChild(item);
      });
    }

    // Play specific track
    function playTrack(index) {
      currentTrackIndex = index;
      const track = playlist[index];
      audioPlayer.src = track.src;
      currentSongTitle.textContent = track.title;
      currentSongArtist.textContent = track.artist;
      
      // Update active state in playlist
      document.querySelectorAll('.playlist-item').forEach((item, i) => {
        item.classList.toggle('active', i === index);
      });
      
      playAudio();
    }

    // Toggle play/pause
    function togglePlay() {
      if (isPlaying) {
        pauseAudio();
      } else {
        playAudio();
      }
    }

    // Play audio
    function playAudio() {
      audioPlayer.play();
      isPlaying = true;
      updatePlayPauseIcon();
    }

    // Pause audio
    function pauseAudio() {
      audioPlayer.pause();
      isPlaying = false;
      updatePlayPauseIcon();
    }

    // Next track
    function nextTrack() {
      currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
      playTrack(currentTrackIndex);
    }

    // Previous track
    function previousTrack() {
      currentTrackIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
      playTrack(currentTrackIndex);
    }

    // Seek functionality
    function seek(event) {
      const progressBar = event.currentTarget;
      const rect = progressBar.getBoundingClientRect();
      const percent = (event.clientX - rect.left) / rect.width;
      audioPlayer.currentTime = percent * audioPlayer.duration;
    }

    // Update progress bar
    function updateProgress() {
      if (audioPlayer.duration) {
        const percent = (audioPlayer.currentTime / audioPlayer.duration) * 100;
        progressFill.style.width = percent + '%';
        
        currentTimeDisplay.textContent = formatTime(audioPlayer.currentTime);
        totalTimeDisplay.textContent = formatTime(audioPlayer.duration);
      }
    }

    // Format time
    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs.toString().padStart(2, '0')}`;
    }

    // Toggle playlist sidebar
    function togglePlaylist() {
      const sidebar = document.getElementById('playlistSidebar');
      const btn = document.getElementById('playlistToggleBtn');
      sidebar.classList.toggle('open');
      if (sidebar.classList.contains('open')) {
        btn.style.display = 'none';
      } else {
        btn.style.display = 'flex';
      }
    }

    // Event listeners
    audioPlayer.addEventListener('timeupdate', updateProgress);
    audioPlayer.addEventListener('ended', nextTrack);
    audioPlayer.addEventListener('loadedmetadata', updateProgress);

    // Initialize
    initializePlaylist();
    playTrack(0);

    // Dark mode toggle
    function toggleDarkMode() {
      document.body.classList.toggle('dark');
    }

    // Original functions
    function sayHello() {
      document.getElementById('message').textContent = "!🫢ياقليل الأدب";
    }

    setInterval(() => {
      document.getElementById("clock").textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }, 1000);

    // Replace play/pause icon dynamically
    function updatePlayPauseIcon() {
      const playPauseIcon = document.getElementById('playPauseIcon');
      if (isPlaying) {
        playPauseIcon.innerHTML = `<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>`;
      } else {
        playPauseIcon.innerHTML = `<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>`;
      }
    }
    // Update play/pause icon in playAudio and pauseAudio
    function playAudio() {
      audioPlayer.play();
      isPlaying = true;
      updatePlayPauseIcon();
    }
    function pauseAudio() {
      audioPlayer.pause();
      isPlaying = false;
      updatePlayPauseIcon();
    }
    // On page load, set correct icon
    updatePlayPauseIcon();
  </script>
</body>
</html>
