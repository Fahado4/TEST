<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fahad's First Website</title>
  <style>
    .dark {
      background: linear-gradient(to right, #1a1a1a, #2d2d2d) !important;
      color: white !important;
    }

    .dark button {
      background-color: #333 !important;
      color: white !important;
    }

    .dark button:hover {
      background-color: #555 !important;
      color: white !important;
    }

    body {
      transition: 0.4s;
      font-family: Arial;
      background: linear-gradient(to right, #006400, #004d00);
      color: white;
      text-align: center;
      padding: 20px;
    }

    #darkModeBtn {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 10px 15px;
      font-size: 14px;
      background-color: rgba(255, 255, 255, 0.2);
      color: white;
      border: 2px solid white;
      border-radius: 25px;
      cursor: pointer;
      transition: 0.3s;
    }

    #darkModeBtn:hover {
      background-color: rgba(255, 255, 255, 0.3);
      transform: scale(1.05);
    }

    img {
      width: 300px;
      border-radius: 20px;
      margin: 20px 0;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: white;
      color: green;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background-color: gold;
      color: black;
    }
  </style>
</head>
<body>
  <!-- Audio Player -->
  <div style="position: fixed; top: 20px; left: 20px; z-index: 1000;">
    <audio id="myAudio" loop>
      <source src="youtube_I66_rC6o4K4_audio.opus" type="audio/mpeg">
      Your browser does not support the audio element.
    </audio>
    <button id="audioBtn" style="padding: 10px 15px; background: rgba(255,255,255,0.2); color: white; border: 2px solid white; border-radius: 25px; cursor: pointer;">
      ▶️ Play Music
    </button>
  </div>

  <button id="darkModeBtn">🌙 Toggle Dark Mode</button>

  <script>
    function toggleDarkMode() {
      document.body.classList.toggle('dark');
    }
    document.getElementById('darkModeBtn').addEventListener('click', toggleDarkMode);

    // Audio control
    const audio = document.getElementById('myAudio');
    const audioBtn = document.getElementById('audioBtn');
    
    audioBtn.addEventListener('click', function() {
      if (audio.paused) {
        audio.play();
        audioBtn.innerHTML = '⏸️ Pause Music';
      } else {
        audio.pause();
        audioBtn.innerHTML = '▶️ Play Music';
      }
    });
  </script>
  

  <!-- Header -->
  <h1>Hi, I'm Fahad 👋</h1>
  <p>This is my first website. I'm an Electrical Engineering student who is بيّاع</p>

  <!-- Photo -->
  <img src="sand-castle.webp" alt="Saudi Arabia">

  <!-- Fun Facts -->
  <h2>🌟 Fun Facts About Me</h2>
  <ul style="padding-left: 20px; list-style-position: inside;">
    <li>I love electronics</li>
    <li>I’m learning to code</li>
    <li>I enjoy coffee ☕</li>
  </ul>
  

  <!-- Live Clock -->
  <h2>⏰ Current Time</h2>
  <p id="clock"></p>

  <!-- Button & Message -->
  <button onclick="sayHello()" class="arabic-text">!أضغطني</button>
  <p id="message" class="arabic-text"></p>

  <!-- Script -->
  <script>
    function sayHello() {
      document.getElementById('message').textContent = "!🫢ياقليل الأدب";
    }

    setInterval(() => {
      document.getElementById("clock").textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }, 1000);
  </script>

</body>
</html>
