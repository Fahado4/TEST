<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hello from Fahad!</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to bottom right, #e0f7fa, #fff);
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .container {
      background-color: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 500px;
      z-index: 1;
    }

    h1 {
      font-size: 2.5rem;
      color: #00796b;
      margin-bottom: 10px;
    }

    p {
      font-size: 1rem;
      color: #444;
      margin: 6px 0;
    }

    p:last-child {
      font-size: 0.9rem;
      color: #777;
    }

    /* Bouncing ball */
    #img {
      width: 35px;
      height: 35px;
      background: radial-gradient(circle at 30% 30%, #00bcd4, #00838f);
      border-radius: 50%;
      position: absolute;
      cursor: grab;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
      transition: transform 0.1s ease;
    }

    #img:hover {
      transform: scale(1.1);
    }

    #img:active {
      transform: scale(0.95);
      cursor: grabbing;
    }

    /* Optional floating background bubbles */
    .bubble {
      position: absolute;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: rgba(0, 188, 212, 0.1);
      z-index: 0;
      animation: float 20s infinite ease-in-out;
    }

    .bubble:nth-child(1) {
      top: 10%;
      left: 10%;
      animation-delay: 0s;
    }

    .bubble:nth-child(2) {
      bottom: 10%;
      right: 10%;
      animation-delay: 5s;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-20px);
      }
    }
  </style>
</head>
<body>

  <!-- Background bubbles for visual effect -->
  <div class="bubble"></div>
  <div class="bubble"></div>

  <div class="container">
    <h1>I am Fahad</h1>
    <p>Welcome to my very first web page.</p>
    <p>العب بالكورة 😜</p>
  </div>

  <div id="img"></div>

  <!-- JavaScript (Unchanged Physics Engine) -->
  <script>
    var xPos = 100;
    var yPos = 100;
    var xVel = 0, yVel = 0;
    var gravity = 0.5;
    var bounce = 0.8;
    var friction = 0.99;
    var interval;
    var isDragging = false;
    var dragStartX = 0, dragStartY = 0;
    var lastMouseX = 0, lastMouseY = 0;
    var hasStarted = false;
    var ball = document.getElementById('img');

    function updateBall() {
      var width = window.innerWidth;
      var height = window.innerHeight;

      if (hasStarted) {
        yVel += gravity;
        xVel *= friction;
        yVel *= friction;

        xPos += xVel;
        yPos += yVel;

        if (xPos <= 0 || xPos >= width - 35) {
          xPos = Math.max(0, Math.min(xPos, width - 35));
          xVel = -xVel * bounce;
        }

        if (yPos >= height - 35) {
          yPos = height - 35;
          yVel = -Math.abs(yVel) * bounce;
          if (Math.abs(xVel) < 1) xVel = (Math.random() - 0.5) * 4;
        }

        if (yPos <= 0) {
          yPos = 0;
          yVel = Math.abs(yVel) * bounce;
        }

        if (Math.abs(xVel) < 0.5 && Math.abs(yVel) < 0.5) {
          xVel = (Math.random() - 0.5) * 6;
          yVel = (Math.random() - 0.5) * 6;
        }
      }

      ball.style.left = xPos + 'px';
      ball.style.top = yPos + 'px';
    }

    function start() {
      ball.style.visibility = "visible";
      if (!interval) interval = setInterval(updateBall, 16);
    }

    function handleMouseDown(e) {
      if (e.button === 0) {
        isDragging = true;
        dragStartX = lastMouseX = e.clientX;
        dragStartY = lastMouseY = e.clientY;
        document.addEventListener('mousemove', handleMouseMove);
        document.addEventListener('mouseup', handleMouseUp);
        e.preventDefault();
      }
    }

    function handleMouseMove(e) {
      if (isDragging) {
        lastMouseX = e.clientX;
        lastMouseY = e.clientY;
      }
    }

    function handleMouseUp(e) {
      if (isDragging) {
        isDragging = false;
        document.removeEventListener('mousemove', handleMouseMove);
        document.removeEventListener('mouseup', handleMouseUp);

        var deltaX = e.clientX - dragStartX;
        var deltaY = e.clientY - dragStartY;
        var distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);

        if (distance > 5) {
          hasStarted = true;
          var kickPower = Math.min(distance / 3, 15);
          xVel += (deltaX / distance) * kickPower;
          yVel += (deltaY / distance) * kickPower;

          if (Math.abs(xVel) < 2) xVel = (deltaX > 0 ? 1 : -1) * 2;
          if (Math.abs(yVel) < 2) yVel = (deltaY > 0 ? 1 : -1) * 2;
        }
      }
    }

    window.onload = function () {
      ball.addEventListener('mousedown', handleMouseDown);
      start();
    };

    setInterval(function () {
      if (!interval && hasStarted) start();
    }, 1000);
  </script>

</body>
</html>
