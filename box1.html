<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Projects & Accomplishments</title>
  <style>
    :root {
      --bg-grad-1: #667eea;
      --bg-grad-2: #764ba2;
      --card-bg: rgba(255, 255, 255, 0.18);
      --card-border: rgba(255, 255, 255, 0.28);
      --text-on-dark: #ffffff;
      --muted: #e7e7e7;
      --accent: #1db954;
    }

    /* Local webfonts so sheet-driven font-family values (e.g., 'TH_EN', 'TH_AR') work here too */
    @font-face {
      font-family: 'TH_EN';
      src: url('TH51ef91f752500ffb-s.p.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
      unicode-range: U+0000-00FF, U+0100-024F, U+1E00-1EFF, U+2000-206F, U+20A0-20CF, U+2100-214F;
    }
    @font-face {
      font-family: 'TH_AR';
      src: url('REGULAR-IBMPlexSansArabic-Regular.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
      unicode-range: U+0600-06FF, U+0750-077F, U+08A0-08FF, U+FB50-FDFF, U+FE70-FEFF;
    }
    @font-face {
      font-family: 'TH_AR';
      src: url('BOLD-IBMPlexSansArabic-SemiBold.otf') format('opentype');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
      unicode-range: U+0600-06FF, U+0750-077F, U+08A0-08FF, U+FB50-FDFF, U+FE70-FEFF;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, var(--bg-grad-1) 0%, var(--bg-grad-2) 100%);
      color: #f7f7f7;
      line-height: 1.6;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    .main-content {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 14px 120px;
      background: rgba(255, 255, 255, 0.08);
      min-height: 100vh;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border-left: 1px solid rgba(255, 255, 255, 0.12);
      border-right: 1px solid rgba(255, 255, 255, 0.12);
    }

    header.page-header {
      text-align: center;
      padding: 40px 16px 28px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      margin-bottom: 22px;
    }

    header.page-header h1 {
      font-size: 2.4rem;
      font-weight: 800;
      background: linear-gradient(45deg, #fff, #ededed);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 10px;
    }

    header.page-header p {
      color: var(--muted);
      font-size: 1.1rem;
      opacity: 0.95;
    }

    .projects {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      margin-top: 12px;
    }

    .project-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.10);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .project-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 22px rgba(0, 0, 0, 0.14);
    }

    .project-media {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      background: rgba(0,0,0,0.25);
    }

    .project-image {
      display: inline-block;
      width: auto;
      height: auto;
      max-width: 100%;
      object-fit: contain;
      aspect-ratio: auto;
      border-radius: 8px;
    }

    .project-body {
      padding: 22px 20px 18px;
    }

    .project-title {
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 8px;
      color: var(--text-on-dark);
      text-align: left;
    }

    .project-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 10px 0 12px;
    }

    .tag {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 0.85rem;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.28);
      color: #fff;
      white-space: nowrap;
    }

    .project-desc {
      color: #f3f3f3;
      font-size: 1.02rem;
      opacity: 0.98;
    }

    .section-label {
      margin-top: 14px;
      margin-bottom: 8px;
      font-weight: 800;
      letter-spacing: 0.2px;
      color: #fff;
    }

    .accomplishments {
      padding-left: 18px;
      color: #f3f3f3;
    }

    .accomplishments li { margin: 6px 0; }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }

    .btn {
      appearance: none;
      border: 2px solid rgba(255, 255, 255, 0.45);
      background: transparent;
      color: #fff;
      padding: 12px 18px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
      letter-spacing: 0.2px;
      transition: all 0.15s ease;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06), 0 2px 8px rgba(0,0,0,0.15);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn:hover { background: rgba(255,255,255,0.18); transform: translateY(-1px); }
    .btn.primary { background: var(--accent); border-color: var(--accent); }
    .btn.primary:hover { filter: brightness(1.06); }

    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .back-link { color: #fff; opacity: 0.9; text-decoration: none; font-weight: 700; }
    .back-link:hover { text-decoration: underline; }

    footer {
      text-align: center;
      margin-top: 32px;
      color: #e9e9e9;
      opacity: 0.9;
    }

    @media (max-width: 640px) {
      header.page-header { padding: 28px 14px 20px; }
      header.page-header h1 { font-size: 1.8rem; }
      .project-title { font-size: 1.35rem; }
      .project-body { padding: 18px 14px 16px; }
      .btn { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
  <main class="main-content">
    <nav class="top-nav">
      <a class="back-link" href="index.html">← Back to Home</a>
      <span style="font-size: 0.95rem; opacity: 0.9">Scroll to explore projects</span>
    </nav>

    <header class="page-header">
      <h1>Projects & Accomplishments</h1>
      <p>Explore my work below. Each card includes a short description, tech stack, highlights, and links.</p>
    </header>

    <section class="projects" id="projectsContainer">
      <!-- Dynamic projects will render here from Google Sheets -->
    </section>

    <footer>
      &copy; <span id="year"></span> Fahad &middot; Projects
    </footer>
  </main>

  <script>
    // Footer year
    document.getElementById('year').textContent = new Date().getFullYear();

    // ===== Google Sheets configuration =====
    // How to set up:
    // 1) Create a Google Sheet with a header row containing these columns:
    //    title | description | tags | bullets | image | demo | source
    //    - tags: comma-separated (e.g., HTML, CSS, JS)
    //    - bullets: separate items with a semicolon ; (e.g., Fast; Responsive; Accessible)
    // 2) File > Share > Anyone with the link (Viewer)
    // 3) Use the Sheet ID and Sheet name below. No need to "Publish to the web" when using gviz.
    const SHEET_ID = '15sORz8u-YaT1QON-BdUklgQhinjeFB0sfStrkYe7QeQ';
    const SHEET_NAME = 'webProjects'; // e.g., 'Sheet1' or 'Projects'

    // Build GViz URL (returns JSON wrapped in JS)
    const GVIZ_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_NAME)}`;
    // CSV fallback (no need to publish when sheet is public Viewer)
    const GVIZ_CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME)}`;
    // Optional: If you use File → Share → Publish to the web → Entire sheet (or specific tab) → CSV, paste that link here.
    // When set, this URL is used first and will bypass org-level sharing restrictions.
    const PUBLISHED_CSV_URL = '';

    // Target container
    const container = document.getElementById('projectsContainer');
    // Debug UI disabled: provide safe dummies so existing code doesn't error
    const debugPanel = { style: { display: 'none' } };
    const debugContent = { set textContent(_) {} };
    const lastLoadInfo = { url: '', headers: [], count: 0, firstItem: null };

    // Cache-busting helper to force fresh data from Google
    function buildNoCache(url) {
      const sep = url.includes('?') ? '&' : '?';
      return `${url}${sep}rnd=${Date.now()}`;
    }

    // Treat only http(s) links or common image extensions as valid image URLs
    function isLikelyImageUrl(url) {
      url = String(url || '').trim();
      if (!/^https?:\/\//i.test(url)) return false;
      try {
        const u = new URL(url);
        const host = u.hostname.toLowerCase();
        const path = (u.pathname || '').toLowerCase();
        // Accept if pathname ends with a known image extension
        if (/\.(png|jpe?g|webp|gif|bmp|svg)$/.test(path)) return true;
        // Accept if extension appears before query/hash (e.g., .jpeg?...
        if (/\.(png|jpe?g|webp|gif|bmp|svg)(?:[?#].*)?$/.test(url.toLowerCase())) return true;
        // Whitelist common image CDNs that often omit extensions
        if (host.endsWith('redd.it') || host.endsWith('redditmedia.com') || host.endsWith('twimg.com')) return true;
        return false;
      } catch {
        // Fallback simple check: extension before query/hash
        return /\.(png|jpe?g|webp|gif|bmp|svg)(?:[?#].*)?$/i.test(url);
      }
    }

    // Split a cell that may contain multiple image URLs (comma or newline separated)
    function splitImages(value) {
      const raw = String(value || '').trim();
      if (!raw) return [];
      return raw
        .split(/,|\n|\r/g)
        .map(s => s.trim())
        .filter(s => s.length > 0 && isLikelyImageUrl(s));
    }

    // Minimal safe sanitizer for inline HTML coming from Sheet
    function sanitizeHtml(input) {
      const allowedTags = new Set(['b','strong','i','em','u','span','a','br']);
      const allowedAttrs = {
        'a': new Set(['href','target','rel','title','style']),
        'span': new Set(['style']),
        'b': new Set(['style']),
        'strong': new Set(['style']),
        'i': new Set(['style']),
        'em': new Set(['style']),
        'u': new Set(['style'])
      };
      const allowedStyles = new Set([
        'color','font','font-family','font-size','font-weight','font-style','text-decoration','letter-spacing','line-height',
        'background','background-color','background-image','text-align','text-shadow',
        'border','border-radius','padding','margin','display','white-space'
      ]);
      const tpl = document.createElement('template');
      tpl.innerHTML = String(input || '');
      (function walk(node){
        const children = Array.from(node.childNodes);
        for (const child of children) {
          if (child.nodeType === 1) { // ELEMENT_NODE
            const tag = child.tagName.toLowerCase();
            if (!allowedTags.has(tag)) {
              // Replace disallowed element with its text content
              const text = document.createTextNode(child.textContent || '');
              node.replaceChild(text, child);
              continue;
            }
            // Clean attributes
            const aAllowed = allowedAttrs[tag] || new Set();
            // Copy to array because we'll remove while iterating
            for (const attr of Array.from(child.attributes)) {
              const name = attr.name.toLowerCase();
              if (!aAllowed.has(name)) {
                child.removeAttribute(name);
                continue;
              }
              if (name === 'href') {
                const val = attr.value || '';
                // Only allow http/https/mailto/tel
                if (!/^(https?:|mailto:|tel:)/i.test(val)) {
                  child.removeAttribute(name);
                }
              }
              if (name === 'target') {
                // Force safe target
                child.setAttribute('target', '_blank');
                child.setAttribute('rel', 'noopener');
              }
              if (name === 'style') {
                // Filter style properties
                const style = child.getAttribute('style') || '';
                const safe = style.split(';').map(s => s.trim()).filter(Boolean).filter(rule => {
                  const idx = rule.indexOf(':');
                  if (idx === -1) return false;
                  const prop = rule.slice(0, idx).trim().toLowerCase();
                  return allowedStyles.has(prop);
                }).join('; ');
                if (safe) child.setAttribute('style', safe);
                else child.removeAttribute('style');
              }
            }
            walk(child);
          } else if (child.nodeType === 8) { // COMMENT_NODE
            node.removeChild(child);
          }
        }
      })(tpl.content || tpl);
      return (tpl.innerHTML || '').trim();
    }

    // Turn a URL into an embeddable PDF URL (supports Google Drive links)
    function toEmbeddablePdfUrl(url) {
      url = String(url || '').trim();
      try {
        const u = new URL(url);
        const host = u.hostname.toLowerCase();
        if (host.includes('drive.google.com')) {
          // Handle /file/d/ID/... and open?id=ID formats
          const m1 = u.pathname.match(/\/file\/d\/([^/]+)\//);
          const id = m1 ? m1[1] : u.searchParams.get('id');
          if (id) return `https://drive.google.com/file/d/${id}/preview`;
        }
      } catch {}
      return url;
    }

    // Create a VERTICAL gallery (one image per line)
    function createMediaGallery(imgFieldValue, title) {
      const urls = splitImages(imgFieldValue);
      if (!urls.length) return null;
      const wrap = document.createElement('div');
      wrap.style.cssText = 'display:flex;flex-direction:column;gap:8px;margin-bottom:8px;';
      for (const u of urls) {
        const img = document.createElement('img');
        img.className = 'project-image';
        img.src = u;
        img.alt = `Preview for ${title}`;
        img.onerror = () => { try { img.remove(); } catch {} };
        wrap.appendChild(img);
      }
      // If all images failed, return null
      queueMicrotask(() => { if (!wrap.querySelector('img')) try { wrap.remove(); } catch {} });
      return wrap;
    }

    // Safely escape HTML (basic)
    function escapeHtml(s) {
      return String(s || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // Render description with inline images using Markdown: ![alt](url) or [img:URL]
    function renderDescWithInlineImages(desc, title) {
      let html = escapeHtml(desc);
      // Convert ![alt](url)
      html = html.replace(/!\[(.*?)\]\((https?:\/\/[^\s)]+)\)/g, (m, alt, url) => {
        if (!isLikelyImageUrl(url)) return m;
        const a = escapeHtml(alt);
        const u = escapeHtml(url);
        return `<img src="${u}" alt="${a || 'Image for ' + escapeHtml(title)}" style="width:auto;max-width:100%;height:auto;display:block;margin:8px 0;border-radius:8px;">`;
      });
      // Convert [img:URL] with optional whitespace
      html = html.replace(/\[img:\s*(https?:\/\/\S+)\s*\]/g, (m, url) => {
        if (!isLikelyImageUrl(url)) return m;
        const u = escapeHtml(url);
        return `<img src="${u}" alt="Image for ${escapeHtml(title)}" style="width:auto;max-width:100%;height:auto;display:block;margin:8px 0;border-radius:8px;">`;
      });
      // Convert [pdf:URL] with optional whitespace
      html = html.replace(/\[pdf:\s*(https?:\/\/\S+)\s*\]/g, (m, url) => {
        const u = escapeHtml(toEmbeddablePdfUrl(url));
        return `<iframe src="${u}" style="width:100%;height:600px;border:0;border-radius:8px;" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>`;
      });
      // Turn simple line breaks into <br> for nicer formatting
      html = html.replace(/\n/g, '<br>');
      return html;
    }

    // Remove rows that look like headers or are entirely empty
    function isHeaderLikeRow(it) {
      const v = (s) => String(s || '').trim().toLowerCase();
      const title = v(it.title || it.col_0);
      const desc = v(it.description || it.col_1);
      // If first two fields are literally 'title' and 'description', treat as header row
      if (title === 'title' && desc === 'description') return true;
      // If most values are one of known header keywords, also treat as header
      const vals = [title, desc, v(it.tags || it.col_2), v(it.bullets || it.col_3), v(it.image || it.col_4), v(it.demo || it.col_5), v(it.source || it.col_6)];
      const headerWords = new Set(['title','description','tags','bullets','image','demo','source']);
      const headerCount = vals.filter(x => headerWords.has(x)).length;
      return headerCount >= 3; // heuristically consider as header
    }

    function isAllEmpty(it) {
      const vals = [it.title, it.description, it.tags, it.bullets, it.image, it.demo, it.source]
        .map(x => String(x).trim());
      return vals.every(x => x.length === 0);
    }

    function sanitizeItems(items) {
      const cleaned = items.filter(it => !isHeaderLikeRow(it) && !isAllEmpty(it));
      return cleaned;
    }

    function fetchAndRender() {
      // Optional: show a loading indicator
      const loading = document.createElement('div');
      loading.textContent = 'Loading projects...';
      loading.style.cssText = 'opacity:0.9;padding:10px 0;text-align:center;';
      container.prepend(loading);

      // Helper to render items list
      function renderItems(items) {
        container.innerHTML = '';
        if (!items.length) {
          const card = document.createElement('article'); card.className = 'project-card';
          const body = document.createElement('div'); body.className = 'project-body';
          const h2 = document.createElement('h2'); h2.className = 'project-title'; h2.textContent = 'No projects yet';
          const p = document.createElement('p'); p.className = 'project-desc'; p.innerHTML = renderDescWithInlineImages('Add rows under your headers in Google Sheets, then click Refresh.', 'Untitled');
          body.appendChild(h2); body.appendChild(p); card.appendChild(body); container.appendChild(card);
          return;
        }
        for (const it of items) {
          const title = it.title || 'Untitled';
          const desc = it.description || '';
          const tags = (it.tags || '').split(',').map(s => s.trim()).filter(Boolean);
          const bullets = (it.bullets || '').split(';').map(s => s.trim()).filter(Boolean);
          const img = it.image || '';
          const demo = it.demo || '';
          const source = it.source || '';
          const titleStyle = it.title_style || '';
          const descStyle = it.desc_style || '';
          const cardStyle = it.card_style || '';
          const titleHtml = it.title_html || '';
          const descHtml = it.desc_html || '';

          const article = document.createElement('article');
          article.className = 'project-card';
          if (cardStyle) article.style.cssText += ';' + cardStyle;

          const mediaGallery = createMediaGallery(img, title);
          if (mediaGallery) article.appendChild(mediaGallery);

          const body = document.createElement('div');
          body.className = 'project-body';

          const h2 = document.createElement('h2');
          h2.className = 'project-title';
          if (titleHtml) { h2.innerHTML = sanitizeHtml(titleHtml); }
          else { h2.textContent = title; }
          if (titleStyle) h2.style.cssText += ';' + titleStyle;

          const p = document.createElement('p');
          p.className = 'project-desc';
          if (descHtml) { p.innerHTML = sanitizeHtml(descHtml); }
          else { p.innerHTML = renderDescWithInlineImages(desc, title); }
          if (descStyle) p.style.cssText += ';' + descStyle;

          const meta = document.createElement('div');
          meta.className = 'project-meta';
          for (const tag of tags) {
            const s = document.createElement('span');
            s.className = 'tag';
            s.textContent = tag;
            meta.appendChild(s);
          }

          body.appendChild(h2);
          body.appendChild(p);
          body.appendChild(meta);

          if (bullets.length) {
            const lbl = document.createElement('h3');
            lbl.className = 'section-label';
            lbl.textContent = 'Accomplishments';
            const ul = document.createElement('ul');
            ul.className = 'accomplishments';
            for (const b of bullets) {
              const li = document.createElement('li');
              li.textContent = b;
              ul.appendChild(li);
            }
            body.appendChild(lbl);
            body.appendChild(ul);
          }

          const actions = document.createElement('div');
          actions.className = 'actions';
          if (demo) {
            const a = document.createElement('a');
            a.className = 'btn primary';
            a.href = demo;
            a.target = '_blank';
            a.rel = 'noopener';
            a.textContent = 'Live Demo';
            actions.appendChild(a);
          }
          if (source) {
            const a2 = document.createElement('a');
            a2.className = 'btn';
            a2.href = source;
            a2.target = '_blank';
            a2.rel = 'noopener';
            a2.textContent = 'Source Code';
            actions.appendChild(a2);
          }
          body.appendChild(actions);

          article.appendChild(body);
          container.appendChild(article);
        }
        debugContent.textContent = JSON.stringify(lastLoadInfo, null, 2);
      }

      // Helper to render a visible error card
      function showError(reason, urlTried) {
        const card = document.createElement('article');
        card.className = 'project-card';
        const body = document.createElement('div'); body.className = 'project-body';
        const h2 = document.createElement('h2'); h2.className = 'project-title'; h2.textContent = 'Could not load projects';
        const p = document.createElement('p'); p.className = 'project-desc'; p.innerHTML = `Reason: <code>${reason}</code>`;
        const ul = document.createElement('ul'); ul.className = 'accomplishments'; ul.innerHTML = `
          <li>Verify sharing: Google Sheet → Share → Anyone with the link → Viewer</li>
          <li>Confirm tab name (<b>SHEET_NAME</b>) exactly matches: <code>${SHEET_NAME}</code></li>
          <li>Headers required: <b>title, description, tags, bullets, image, demo, source</b></li>
          <li>URL tried: <code style="word-break: break-all;">${urlTried}</code></li>`;
        body.appendChild(h2); body.appendChild(p); body.appendChild(ul); card.appendChild(body);
        container.innerHTML = ''; container.appendChild(card);
      }

      // If a Published CSV URL is provided, use it first
      const primaryURL = PUBLISHED_CSV_URL && PUBLISHED_CSV_URL.trim().length ? PUBLISHED_CSV_URL.trim() : null;
      if (primaryURL) {
        fetch(primaryURL)
          .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status} ${r.statusText}`); return r.text(); })
          .then(csv => {
            // minimal CSV parse (same as fallback)
            function parseCSV(text) {
              const rows = []; let cur = '', row = [], inQuotes = false; 
              for (let i = 0; i < text.length; i++) {
                const ch = text[i], next = text[i+1];
                if (ch === '"') { if (inQuotes && next === '"') { cur += '"'; i++; } else { inQuotes = !inQuotes; } }
                else if (ch === ',' && !inQuotes) { row.push(cur); cur = ''; }
                else if ((ch === '\n' || ch === '\r') && !inQuotes) { if (cur.length || row.length) { row.push(cur); rows.push(row); } cur = ''; row = []; }
                else { cur += ch; }
              }
              if (cur.length || row.length) { row.push(cur); rows.push(row); }
              return rows;
            }
            const rows = parseCSV(csv).filter(r => r.some(v => String(v).trim() !== ''));
            if (!rows.length) throw new Error('CSV returned no rows.');

            const rawHeaders = rows[0];
            const headers = rawHeaders.map(h => (h || '').trim().toLowerCase());
            const dataRows = rows.slice(1);

            const indices = {
              title: headers.indexOf('title'),
              description: headers.indexOf('description'),
              tags: headers.indexOf('tags'),
              bullets: headers.indexOf('bullets'),
              image: headers.indexOf('image'),
              demo: headers.indexOf('demo'),
              source: headers.indexOf('source'),
              title_style: headers.indexOf('title_style'),
              desc_style: headers.indexOf('desc_style'),
              card_style: headers.indexOf('card_style'),
              title_html: headers.indexOf('title_html'),
              desc_html: headers.indexOf('desc_html')
            };

            const hasHeaders = indices.title !== -1 && indices.description !== -1;

            const items = dataRows.map(r => {
              function valAt(idx) { return String((idx >= 0 && idx < r.length ? r[idx] : '') ?? '').trim(); }
              if (hasHeaders) {
                return {
                  title: valAt(indices.title),
                  description: valAt(indices.description),
                  tags: valAt(indices.tags),
                  bullets: valAt(indices.bullets),
                  image: valAt(indices.image),
                  demo: valAt(indices.demo),
                  source: valAt(indices.source),
                  title_style: valAt(indices.title_style),
                  desc_style: valAt(indices.desc_style),
                  card_style: valAt(indices.card_style),
                  title_html: valAt(indices.title_html),
                  desc_html: valAt(indices.desc_html)
                };
              }
              // Positional fallback: 0..6 => title, description, tags, bullets, image, demo, source
              return {
                title: valAt(0),
                description: valAt(1),
                tags: valAt(2),
                bullets: valAt(3),
                image: valAt(4),
                demo: valAt(5),
                source: valAt(6)
              };
            }).filter(it => it.title || it.description);

            const itemsClean = sanitizeItems(items);

            renderItems(itemsClean);

            // Show a tiny success note (non-intrusive)
            const note = document.createElement('div');
            note.style.cssText = 'text-align:center;opacity:.85;margin:8px 0;font-size:.9rem;';
            note.textContent = `Loaded ${itemsClean.length} project(s) from Published CSV`;
            container.prepend(note);
          })
          .catch(err => {
            console.warn('Published CSV URL failed:', err);
            // Try GViz JSONP as a final fallback to bypass CORS
            loadGVizJSONP(buildNoCache(GVIZ_URL))
              .then(gvizData => {
                lastLoadInfo.url = GVIZ_URL + ' (jsonp, nocache)';
                const items = parseGVizToItems(gvizData);
                const itemsClean = sanitizeItems(items);
                renderItems(itemsClean);
                lastLoadInfo.count = itemsClean.length;
                lastLoadInfo.firstItem = itemsClean[0] || null;
                if (Array.isArray(lastLoadInfo.headers) && lastLoadInfo.headers.length) {
                  try { console.log('Projects headers (JSONP):', lastLoadInfo.headers); } catch {}
                }
                debugContent.textContent = JSON.stringify(lastLoadInfo, null, 2);
              })
              .catch(err2 => {
                console.warn('GViz JSONP also failed:', err2);
                showError((err2 && err2.message) || String(err2), GVIZ_URL + ' (jsonp, nocache)');
              });
          })
          .finally(() => { try { loading.remove(); } catch {} });
        return; // do not continue to GViz when published URL is used
      }

      // JSONP loader for GViz to bypass CORS
      function loadGVizJSONP(gvizUrl) {
        return new Promise((resolve, reject) => {
          // Ensure we request JSON and set a named response handler
          const cbName = `__gvizCb_${Date.now()}`;
          const url = gvizUrl.includes('responseHandler')
            ? gvizUrl
            : gvizUrl.replace('tqx=out:json', `tqx=out:json;responseHandler:${cbName}`);

          let script = document.createElement('script');
          script.src = url;
          script.async = true;

          const timer = setTimeout(() => {
            cleanup();
            reject(new Error('GViz JSONP timeout'));
          }, 8000);

          function cleanup() {
            try { delete window[cbName]; } catch {}
            try { script.remove(); } catch {}
            clearTimeout(timer);
          }

          window[cbName] = (data) => {
            cleanup();
            resolve(data);
          };

          script.onerror = () => {
            cleanup();
            reject(new Error('GViz JSONP failed to load'));
          };

          document.head.appendChild(script);
        });
      }

      // Convert a GViz response object into our items array
      function parseGVizToItems(gvizJson) {
        const cols = (gvizJson.table?.cols || []).map(c => (c.label || '').trim().toLowerCase());
        const rows = (gvizJson.table?.rows || [])
          .map(row => (row.c || []).map(c => (c && (c.f ?? c.v)) ?? ''))
          .filter(r => r.some(v => String(v).trim() !== ''));
        lastLoadInfo.headers = cols;
        const items = rows.map(r => r.reduce((o, v, i) => { o[cols[i] || `col_${i}`] = String(v ?? '').trim(); return o; }, {}));
        return items.map(it => ({
          title: it.title || it.col_0 || '',
          description: it.description || it.col_1 || '',
          tags: it.tags || it.col_2 || '',
          bullets: it.bullets || it.col_3 || '',
          image: it.image || it.col_4 || '',
          demo: it.demo || it.col_5 || '',
          source: it.source || it.col_6 || '',
          title_style: it.title_style || it.col_7 || '',
          desc_style: it.desc_style || it.col_8 || '',
          card_style: it.card_style || it.col_9 || '',
          title_html: it.title_html || it.col_10 || '',
          desc_html: it.desc_html || it.col_11 || ''
        }));
      }

      fetch(buildNoCache(GVIZ_URL))
        .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status} ${r.statusText}`); return r.text(); })
        .then(text => {
          // Robustly extract JSON from GViz response
          const start = text.indexOf('{');
          const end = text.lastIndexOf('}');
          if (start === -1 || end === -1) {
            throw new Error('Could not parse Google Sheets response.');
          }
          const json = JSON.parse(text.slice(start, end + 1));

          const cols = (json.table?.cols || []).map(c => (c.label || '').trim().toLowerCase());
          const rows = (json.table?.rows || [])
            .map(row => (row.c || []).map(c => (c && (c.f ?? c.v)) ?? ''))
            .filter(r => r.some(v => String(v).trim() !== ''));

          if (!cols.length) throw new Error('No headers found.');

          // Convert rows to objects keyed by header labels
          const items = rows.map(r => r.reduce((o, v, i) => { o[cols[i] || `col_${i}`] = String(v ?? '').trim(); return o; }, {}));

          // Validate presence of required columns
          const required = ['title', 'description'];
          const missing = required.filter(k => !cols.includes(k));
          if (missing.length) throw new Error('Missing required columns: ' + missing.join(', '));

          // Clear existing static cards once data is ready
          container.innerHTML = '';

          const itemsClean = sanitizeItems(items);

          lastLoadInfo.headers = cols;
          try { console.log('Projects headers (GViz):', cols); } catch {}

          if (!itemsClean.length) {
            // Empty-state card
            const card = document.createElement('article');
            card.className = 'project-card';
            const body = document.createElement('div'); body.className = 'project-body';
            const h2 = document.createElement('h2'); h2.className = 'project-title'; h2.textContent = 'No projects yet';
            const p = document.createElement('p'); p.className = 'project-desc'; p.innerHTML = renderDescWithInlineImages('Add rows under your headers in Google Sheets, then click Refresh.', 'Untitled');
            body.appendChild(h2); body.appendChild(p); card.appendChild(body); container.appendChild(card);
            return;
          }

          // Render each item
          for (const it of itemsClean) {
            const title = it.title || 'Untitled';
            const desc = it.description || '';
            const tags = (it.tags || '').split(',').map(s => s.trim()).filter(Boolean);
            const bullets = (it.bullets || '').split(';').map(s => s.trim()).filter(Boolean);
            const img = it.image || '';
            const demo = it.demo || '';
            const source = it.source || '';
            const titleStyle = it.title_style || '';
            const descStyle = it.desc_style || '';
            const cardStyle = it.card_style || '';
            const titleHtml = it.title_html || '';
            const descHtml = it.desc_html || '';

            const article = document.createElement('article');
            article.className = 'project-card';
            if (cardStyle) article.style.cssText += ';' + cardStyle;

            const mediaGallery = createMediaGallery(img, title);
            if (mediaGallery) article.appendChild(mediaGallery);

            const body = document.createElement('div');
            body.className = 'project-body';

            const h2 = document.createElement('h2');
            h2.className = 'project-title';
            if (titleHtml) { h2.innerHTML = sanitizeHtml(titleHtml); }
            else { h2.textContent = title; }
            if (titleStyle) h2.style.cssText += ';' + titleStyle;

            const p = document.createElement('p');
            p.className = 'project-desc';
            if (descHtml) { p.innerHTML = sanitizeHtml(descHtml); }
            else { p.innerHTML = renderDescWithInlineImages(desc, title); }
            if (descStyle) p.style.cssText += ';' + descStyle;

            const meta = document.createElement('div');
            meta.className = 'project-meta';
            for (const tag of tags) {
              const s = document.createElement('span');
              s.className = 'tag';
              s.textContent = tag;
              meta.appendChild(s);
            }

            body.appendChild(h2);
            body.appendChild(p);
            body.appendChild(meta);

            if (bullets.length) {
              const lbl = document.createElement('h3');
              lbl.className = 'section-label';
              lbl.textContent = 'Accomplishments';
              const ul = document.createElement('ul');
              ul.className = 'accomplishments';
              for (const b of bullets) {
                const li = document.createElement('li');
                li.textContent = b;
                ul.appendChild(li);
              }
              body.appendChild(lbl);
              body.appendChild(ul);
            }

            const actions = document.createElement('div');
            actions.className = 'actions';
            if (demo) {
              const a = document.createElement('a');
              a.className = 'btn primary';
              a.href = demo;
              a.target = '_blank';
              a.rel = 'noopener';
              a.textContent = 'Live Demo';
              actions.appendChild(a);
            }
            if (source) {
              const a2 = document.createElement('a');
              a2.className = 'btn';
              a2.href = source;
              a2.target = '_blank';
              a2.rel = 'noopener';
              a2.textContent = 'Source Code';
              actions.appendChild(a2);
            }
            body.appendChild(actions);

            article.appendChild(body);
            container.appendChild(article);
          }
          lastLoadInfo.count = itemsClean.length;
          lastLoadInfo.firstItem = itemsClean[0] || null;
          try {
            console.log('Projects headers (GViz):', cols);
            if (lastLoadInfo.firstItem) console.log('First item (GViz):', lastLoadInfo.firstItem);
          } catch {}
          debugContent.textContent = JSON.stringify(lastLoadInfo, null, 2);
        })
        .catch(err => {
          console.warn('GViz JSON failed, trying CSV fallback. Reason:', err);
          // Try CSV fallback
          return fetch(buildNoCache(GVIZ_CSV_URL)).then(r => {
            if (!r.ok) throw new Error(`CSV HTTP ${r.status} ${r.statusText}`);
            return r.text();
          }).then(csv => {
            // Basic CSV parser handling quotes and commas
            function parseCSV(text) {
              const rows = [];
              let cur = '', row = [], inQuotes = false; 
              for (let i = 0; i < text.length; i++) {
                const ch = text[i], next = text[i+1];
                if (ch === '"') {
                  if (inQuotes && next === '"') { cur += '"'; i++; }
                  else { inQuotes = !inQuotes; }
                } else if (ch === ',' && !inQuotes) {
                  row.push(cur); cur = '';
                } else if ((ch === '\n' || ch === '\r') && !inQuotes) {
                  if (cur.length || row.length) { row.push(cur); rows.push(row); }
                  cur = ''; row = [];
                } else {
                  cur += ch;
                }
              }
              if (cur.length || row.length) { row.push(cur); rows.push(row); }
              return rows;
            }

            const rows = parseCSV(csv).filter(r => r.some(v => String(v).trim() !== ''));
            if (!rows.length) throw new Error('CSV returned no rows.');

            const rawHeaders = rows[0];
            const headers = rawHeaders.map(h => (h || '').trim().toLowerCase());
            const dataRows = rows.slice(1);

            const indices = {
              title: headers.indexOf('title'),
              description: headers.indexOf('description'),
              tags: headers.indexOf('tags'),
              bullets: headers.indexOf('bullets'),
              image: headers.indexOf('image'),
              demo: headers.indexOf('demo'),
              source: headers.indexOf('source'),
              title_style: headers.indexOf('title_style'),
              desc_style: headers.indexOf('desc_style'),
              card_style: headers.indexOf('card_style'),
              title_html: headers.indexOf('title_html'),
              desc_html: headers.indexOf('desc_html')
            };
            const hasHeaders = indices.title !== -1 && indices.description !== -1;

            const items = dataRows.map(r => {
              function valAt(idx) { return String((idx >= 0 && idx < r.length ? r[idx] : '') ?? '').trim(); }
              if (hasHeaders) {
                return {
                  title: valAt(indices.title),
                  description: valAt(indices.description),
                  tags: valAt(indices.tags),
                  bullets: valAt(indices.bullets),
                  image: valAt(indices.image),
                  demo: valAt(indices.demo),
                  source: valAt(indices.source),
                  title_style: valAt(indices.title_style),
                  desc_style: valAt(indices.desc_style),
                  card_style: valAt(indices.card_style),
                  title_html: valAt(indices.title_html),
                  desc_html: valAt(indices.desc_html)
                };
              }
              // Positional fallback: 0..6 => title, description, tags, bullets, image, demo, source
              return {
                title: valAt(0),
                description: valAt(1),
                tags: valAt(2),
                bullets: valAt(3),
                image: valAt(4),
                demo: valAt(5),
                source: valAt(6)
              };
            }).filter(it => it.title || it.description);

            const itemsClean = sanitizeItems(items);

            container.innerHTML = '';
            if (!itemsClean.length) {
              const card = document.createElement('article');
              card.className = 'project-card';
              const body = document.createElement('div'); body.className = 'project-body';
              const h2 = document.createElement('h2'); h2.className = 'project-title'; h2.textContent = 'No projects yet';
              const p = document.createElement('p'); p.className = 'project-desc'; p.innerHTML = renderDescWithInlineImages('Add rows in Google Sheets, then click Refresh.', 'Untitled');
              body.appendChild(h2); body.appendChild(p); card.appendChild(body); container.appendChild(card);
              return;
            }

            for (const it of itemsClean) {
              const title = it.title || 'Untitled';
              const desc = it.description || '';
              const tags = (it.tags || '').split(',').map(s => s.trim()).filter(Boolean);
              const bullets = (it.bullets || '').split(';').map(s => s.trim()).filter(Boolean);
              const img = it.image || '';
              const demo = it.demo || '';
              const source = it.source || '';
              const titleStyle = it.title_style || '';
              const descStyle = it.desc_style || '';
              const cardStyle = it.card_style || '';
              const titleHtml = it.title_html || '';
              const descHtml = it.desc_html || '';

              const article = document.createElement('article');
              article.className = 'project-card';
              if (cardStyle) article.style.cssText += ';' + cardStyle;

              const mediaGallery = createMediaGallery(img, title);
              if (mediaGallery) article.appendChild(mediaGallery);

              const body = document.createElement('div');
              body.className = 'project-body';

              const h2 = document.createElement('h2');
              h2.className = 'project-title';
              if (titleHtml) { h2.innerHTML = sanitizeHtml(titleHtml); }
              else { h2.textContent = title; }
              if (titleStyle) h2.style.cssText += ';' + titleStyle;

              const p = document.createElement('p');
              p.className = 'project-desc';
              if (descHtml) { p.innerHTML = sanitizeHtml(descHtml); }
              else { p.innerHTML = renderDescWithInlineImages(desc, title); }
              if (descStyle) p.style.cssText += ';' + descStyle;

              const meta = document.createElement('div');
              meta.className = 'project-meta';
              for (const tag of tags) {
                const s = document.createElement('span');
                s.className = 'tag';
                s.textContent = tag;
                meta.appendChild(s);
              }

              body.appendChild(h2);
              body.appendChild(p);
              body.appendChild(meta);

              if (bullets.length) {
                const lbl = document.createElement('h3');
                lbl.className = 'section-label';
                lbl.textContent = 'Accomplishments';
                const ul = document.createElement('ul');
                ul.className = 'accomplishments';
                for (const b of bullets) {
                  const li = document.createElement('li');
                  li.textContent = b;
                  ul.appendChild(li);
                }
                body.appendChild(lbl);
                body.appendChild(ul);
              }

              const actions = document.createElement('div');
              actions.className = 'actions';
              if (demo) {
                const a = document.createElement('a');
                a.className = 'btn primary';
                a.href = demo;
                a.target = '_blank';
                a.rel = 'noopener';
                a.textContent = 'Live Demo';
                actions.appendChild(a);
              }
              if (source) {
                const a2 = document.createElement('a');
                a2.className = 'btn';
                a2.href = source;
                a2.target = '_blank';
                a2.rel = 'noopener';
                a2.textContent = 'Source Code';
                actions.appendChild(a2);
              }
              body.appendChild(actions);

              article.appendChild(body);
              container.appendChild(article);
            }
            lastLoadInfo.count = itemsClean.length;
            lastLoadInfo.firstItem = itemsClean[0] || null;
            try {
              console.log('Projects headers (GViz):', headers);
              if (lastLoadInfo.firstItem) console.log('First item (GViz):', lastLoadInfo.firstItem);
            } catch {}
            debugContent.textContent = JSON.stringify(lastLoadInfo, null, 2);
          }).catch(csvErr => {
            console.warn('CSV fallback failed. Reason:', csvErr);
            return loadGVizJSONP(buildNoCache(GVIZ_URL))
              .then(gvizData => {
                lastLoadInfo.url = GVIZ_URL + ' (jsonp, nocache)';
                const items = parseGVizToItems(gvizData);
                const itemsClean = sanitizeItems(items);
                renderItems(itemsClean);
                lastLoadInfo.count = itemsClean.length;
                lastLoadInfo.firstItem = itemsClean[0] || null;
                debugContent.textContent = JSON.stringify(lastLoadInfo, null, 2);
              })
              .catch(jsonpErr => {
                console.warn('GViz JSONP failed as well.', jsonpErr);
                const card = document.createElement('article');
                card.className = 'project-card';
                const body = document.createElement('div'); body.className = 'project-body';
                const h2 = document.createElement('h2'); h2.className = 'project-title'; h2.textContent = 'Could not load projects';
                const p = document.createElement('p'); p.className = 'project-desc'; p.innerHTML = `Reason: <code>${(jsonpErr && jsonpErr.message) || jsonpErr}</code>`;
                const ul = document.createElement('ul'); ul.className = 'accomplishments'; ul.innerHTML = `
                  <li>Network/CORS blocked both CSV and GViz. Consider hosting a tiny proxy or using a GitHub JSON file.</li>
                  <li>URLs tried: <code style="word-break: break-all;">${GVIZ_URL} (jsonp, nocache)</code></li>`;
                body.appendChild(h2); body.appendChild(p); body.appendChild(ul); card.appendChild(body);
                container.innerHTML = ''; container.appendChild(card);
              });
          });
        })
        .finally(() => {
          // remove any visible loading text if it exists
          try { loading.remove(); } catch {}
        });
    }

    // If not configured, show setup card instead of fetching
    if (SHEET_ID.includes('PASTE')) {
      showSetupCard();
    } else {
      fetchAndRender();
    }

    // Debug toggle removed
  </script>
</body>
</html>
